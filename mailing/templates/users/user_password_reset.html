{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
    <div class="card mb-3 border-0 nth-shadow">
        <div class="card-body">
            <div class="card-title nth-card-title">
                <h4>Запрос на восстановление пароля на сайте</h4>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark mt-2">Восстановить пароль</button>
            </form>
            {% if messages %}
            <div id="success-message" style="display:none;">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
    <script>
        window.onload = function(){
            var successMessage = document.getElementById("success-message");
            if(successMessage && successMessage.innerHTML.trim() !== "")
            {
                alert(successMessage.innerHTML);
                successMessage.style.display = 'block';
            }
        }
    </script>
{% endblock %}
